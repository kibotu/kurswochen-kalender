<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kurswoche Kalender 2026</title>
    <meta
      name="description"
      content="Beautiful full-year 2026 calendar with Kurswoche (ISO week) labels and today's KW card."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar__inner">
          <div class="brand">
            <div class="brand__title">Kurswoche Kalender</div>
            <div class="brand__subtitle">Full year view for 2026 (ISO week numbers)</div>
          </div>
          <div class="actions">
            <div class="yearpicker" aria-label="Select year">
              <button id="prevYearBtn" class="btn btn--ghost" type="button" aria-label="Previous year">
                ‹
              </button>
              <label class="yearpicker__label" for="yearInput">Year</label>
              <input
                id="yearInput"
                class="yearpicker__input"
                type="number"
                inputmode="numeric"
                min="1900"
                max="2100"
                step="1"
                value="2026"
              />
              <button id="nextYearBtn" class="btn btn--ghost" type="button" aria-label="Next year">
                ›
              </button>
            </div>
            <button id="jumpToTodayBtn" class="btn" type="button">Jump to today</button>
            <button id="jumpToTodayInYearBtn" class="btn btn--secondary" type="button">
              Jump to today (in year)
            </button>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="hero">
          <div class="card card--hero" id="todayCard" aria-live="polite">
            <div class="card__label">Today</div>
            <div class="card__value" id="todayKwValue">KW …</div>
            <div class="card__meta" id="todayKwMeta">…</div>
          </div>
        </section>

        <section class="content">
          <aside class="sidebar">
            <div class="sidebar__header">
              <div class="sidebar__title">Kurswochen (2026)</div>
              <div class="sidebar__subtitle">Click to highlight the week</div>
            </div>
            <div class="kwlist" id="kwList" role="list"></div>
          </aside>

          <section class="calendar">
            <div class="calendar__header">
              <h1 class="calendar__title" id="calendarTitle">2026</h1>
              <div class="calendar__legend">
                <span class="pill">KW = Kurswoche (ISO)</span>
                <span class="pill pill--accent">Today</span>
              </div>
            </div>
            <div class="months" id="months"></div>
          </section>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
